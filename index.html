<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Way Summer Planner</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="mast">
        <img src="assets/jeanneau-sun-odyssey-45ds-hero.png" alt="" class="mast__image">
        <div class="mast__content">
          <p class="eyebrow">My Way</p>
          <h1>Summer Planner</h1>
          <div class="mast__stats" aria-label="Planning summary">
            <span><strong id="trackedPeople">0</strong> people</span>
            <span><strong id="trackedDates">0</strong> blocked date ranges</span>
            <span><strong id="bestScore">0</strong> best availability</span>
          </div>
        </div>
      </section>

      <section class="workspace">
        <aside class="controls" aria-label="Planner settings">
          <div class="field-row">
            <label for="startDate">Start</label>
            <input id="startDate" type="date" value="2026-05-24">
          </div>
          <div class="field-row">
            <label for="endDate">End</label>
            <input id="endDate" type="date" value="2026-10-18">
          </div>
          <div class="field-row">
            <label for="eventLength">Length</label>
            <select id="eventLength">
              <option value="1">1 day</option>
              <option value="2">2 days</option>
              <option value="3">3 days</option>
              <option value="4">4 days</option>
            </select>
          </div>
          <div class="people" id="peopleFilters" aria-label="People"></div>
        </aside>

        <section class="results" aria-live="polite">
          <section class="calendar-section" aria-labelledby="calendarTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Calendar</p>
                <h2 id="calendarTitle">Out-of-town view</h2>
              </div>
              <div class="legend" aria-label="Calendar legend">
                <span><i class="good"></i>clear</span>
                <span><i class="warn"></i>someone OOT</span>
                <span><i class="captain"></i>captain OOT</span>
                <span><i class="bad"></i>both captains OOT</span>
                <span><i class="special"></i>special</span>
                <span><i class="weekend"></i>weekend slot</span>
                <span><i class="holiday"></i>holiday</span>
              </div>
            </div>
            <aside class="date-detail" id="dateDetail" aria-live="polite"></aside>
            <div class="calendar" id="calendar"></div>
          </section>

          <section class="date-search-section" aria-labelledby="dateSearchTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Date Search</p>
                <h2 id="dateSearchTitle">Sort and filter event slots</h2>
              </div>
              <span class="result-count" id="dateResultCount">0 matches</span>
            </div>
            <div class="date-search-controls" aria-label="Date sorting and filters">
              <div class="field-row">
                <label for="sortDates">Sort by</label>
                <select id="sortDates">
                  <option value="oot-low">Fewest OOT</option>
                  <option value="temp-warm">Warmest average temp</option>
                  <option value="temp-cool">Coolest average temp</option>
                  <option value="date-early">Earliest date</option>
                  <option value="special-first">Special dates first</option>
                  <option value="weekend-first">Weekend slots first</option>
                </select>
              </div>
              <div class="field-row">
                <label for="maxOot">Max OOT</label>
                <select id="maxOot">
                  <option value="">Any</option>
                  <option value="0">0 OOT</option>
                  <option value="1">1 OOT</option>
                  <option value="2">2 OOT</option>
                  <option value="3">3 OOT</option>
                </select>
              </div>
              <div class="field-row">
                <label for="dayTypeFilter">Day type</label>
                <select id="dayTypeFilter">
                  <option value="all">Weekend or weekday</option>
                  <option value="weekend">Weekend slots</option>
                  <option value="weekday">Weekday slots</option>
                </select>
              </div>
              <div class="field-row">
                <label for="specialFilter">Special dates</label>
                <select id="specialFilter">
                  <option value="all">With or without</option>
                  <option value="with">Specials only</option>
                  <option value="without">No specials</option>
                </select>
              </div>
              <div class="field-row">
                <label for="minTemp">Min avg temp</label>
                <input id="minTemp" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Any">
              </div>
              <fieldset class="toggle-group toggle-group--wide" aria-label="Days of week">
                <legend>Days</legend>
                <label>
                  <input type="checkbox" name="dayFilter" value="0" checked>
                  <span>Sun</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="1" checked>
                  <span>Mon</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="2" checked>
                  <span>Tue</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="3" checked>
                  <span>Wed</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="4" checked>
                  <span>Thu</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="5" checked>
                  <span>Fri</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="6" checked>
                  <span>Sat</span>
                </label>
              </fieldset>
              <fieldset class="toggle-group" aria-label="Slots">
                <legend>Slots</legend>
                <label>
                  <input type="checkbox" name="slotFilter" value="morning" checked>
                  <span>AM</span>
                </label>
                <label>
                  <input type="checkbox" name="slotFilter" value="evening" checked>
                  <span>PM</span>
                </label>
              </fieldset>
            </div>
            <div class="date-results" id="dateResults"></div>
          </section>
        </section>
      </section>

      <section class="source">
        <div class="section-head">
          <div>
            <p class="eyebrow">Organized Source</p>
            <h2>Out-of-town dates</h2>
          </div>
        </div>
        <div class="source-grid" id="sourceGrid"></div>
      </section>

      <section class="special-summary" id="specialSummary" aria-label="Special dates"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
