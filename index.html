<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Way Summer Planner</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      window.umamiBeforeSendHandler = function(type, payload) {
        try {
          if (localStorage.getItem("is_my_device") === "true") {
            return false;
          }
        } catch (_) {
          // Ignore storage access errors and continue tracking.
        }

        return payload;
      };
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="29ac1f53-e8da-4030-aa93-c7ea40858ef0" data-before-send="umamiBeforeSendHandler"></script>
  </head>
  <body>
    <main class="shell">
      <section class="mast">
        <img src="assets/jeanneau-sun-odyssey-45ds-hero.png" alt="" class="mast__image">
        <div class="mast__content">
          <p class="eyebrow">My Way</p>
          <h1>Summer Planner</h1>
          <a class="page-link" href="reserved-calendar.html">Reserved calendar</a>
        </div>
      </section>

      <section class="workspace">
        <section class="results" aria-live="polite">
          <section class="calendar-section" aria-labelledby="calendarTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Calendar</p>
                <h2 id="calendarTitle">Out-of-town view</h2>
              </div>
              <div class="legend" aria-label="Calendar legend">
                <span><i class="good"></i>clear</span>
                <span><i class="warn"></i>someone OOT</span>
                <span><i class="captain"></i>captain OOT</span>
                <span><i class="bad"></i>both captains OOT</span>
                <span><i class="calendar-result"></i>search result</span>
                <span><i class="reserved"></i>boat reserved</span>
                <span><i class="other-reserved"></i>reserved by others</span>
                <span><i class="special"></i>special</span>
                <span><i class="weekend"></i>weekend slot</span>
                <span><i class="holiday"></i>holiday</span>
              </div>
            </div>
            <aside class="date-detail" id="dateDetail" aria-live="polite"></aside>
            <div class="calendar" id="calendar"></div>
          </section>

          <section class="date-search-section" aria-labelledby="dateSearchTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Date Search</p>
                <h2 id="dateSearchTitle">Sort and filter event slots</h2>
              </div>
              <span class="result-count" id="dateResultCount">0 matches</span>
            </div>
            <div class="date-search-controls" aria-label="Date sorting and filters">
              <div class="field-row">
                <label for="startDate">Start</label>
                <input id="startDate" type="date" value="2026-05-24">
              </div>
              <div class="field-row">
                <label for="endDate">End</label>
                <input id="endDate" type="date" value="2026-10-18">
              </div>
              <div class="field-row">
                <label for="eventLength">Length</label>
                <select id="eventLength">
                  <option value="1">1 slot</option>
                  <option value="2">2 slots - Extended Waters only</option>
                  <option value="3">3 slots - Extended Waters only</option>
                  <option value="4">4 slots - Extended Waters only</option>
                  <option value="5">5 slots - Extended Waters only</option>
                  <option value="6">6 slots - Extended Waters only</option>
                </select>
              </div>
              <div class="field-row">
                <label for="sortDates">Sort by</label>
                <select id="sortDates">
                  <option value="oot-low">Fewest OOT</option>
                  <option value="temp-warm" selected>Warmest average temp</option>
                  <option value="temp-cool">Coolest average temp</option>
                  <option value="date-early">Earliest date</option>
                  <option value="special-first">Special dates first</option>
                  <option value="weekend-first">Weekend slots first</option>
                  <option value="reserved-gap">Largest reserved gap</option>
                </select>
              </div>
              <div class="field-row">
                <label for="dayTypeFilter">Day type</label>
                <select id="dayTypeFilter">
                  <option value="all">Weekend or weekday</option>
                  <option value="weekend">Weekend slots</option>
                  <option value="saturday-two">Saturday 2.0</option>
                  <option value="weekday">Weekday slots</option>
                </select>
              </div>
              <div class="field-row">
                <label for="specialFilter">Special dates</label>
                <select id="specialFilter">
                  <option value="all">With or without</option>
                  <option value="with">Specials only</option>
                  <option value="without">No specials</option>
                </select>
              </div>
              <div class="field-row">
                <label for="minTemp">Min avg temp</label>
                <input id="minTemp" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="Any">
              </div>
              <div class="field-row">
                <label for="topMatches">Top matches</label>
                <input id="topMatches" type="text" inputmode="numeric" pattern="[0-9]*" value="12" placeholder="All">
              </div>
              <label class="toggle">
                <input id="showSearchOnCalendar" type="checkbox">
                <span>Show matches on calendar</span>
              </label>
              <fieldset class="toggle-group toggle-group--wide" aria-label="Days of week">
                <legend>Days</legend>
                <label>
                  <input type="checkbox" name="dayFilter" value="0" checked>
                  <span>Sun</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="1" checked>
                  <span>Mon</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="2" checked>
                  <span>Tue</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="3" checked>
                  <span>Wed</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="4" checked>
                  <span>Thu</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="5" checked>
                  <span>Fri</span>
                </label>
                <label>
                  <input type="checkbox" name="dayFilter" value="6" checked>
                  <span>Sat</span>
                </label>
              </fieldset>
              <fieldset class="toggle-group toggle-group--wide" aria-label="Months">
                <legend>Months</legend>
                <label>
                  <input type="checkbox" name="monthFilter" value="5" checked>
                  <span>May</span>
                </label>
                <label>
                  <input type="checkbox" name="monthFilter" value="6" checked>
                  <span>Jun</span>
                </label>
                <label>
                  <input type="checkbox" name="monthFilter" value="7" checked>
                  <span>Jul</span>
                </label>
                <label>
                  <input type="checkbox" name="monthFilter" value="8" checked>
                  <span>Aug</span>
                </label>
                <label>
                  <input type="checkbox" name="monthFilter" value="9" checked>
                  <span>Sep</span>
                </label>
                <label>
                  <input type="checkbox" name="monthFilter" value="10" checked>
                  <span>Oct</span>
                </label>
              </fieldset>
              <fieldset class="toggle-group" aria-label="Slots">
                <legend>Slots</legend>
                <label>
                  <input type="checkbox" name="slotFilter" value="morning" checked>
                  <span>AM</span>
                </label>
                <label>
                  <input type="checkbox" name="slotFilter" value="evening" checked>
                  <span>PM</span>
                </label>
              </fieldset>
              <div class="field-row date-search-people">
                <span class="control-label">People</span>
                <div class="people" id="peopleFilters" aria-label="People"></div>
              </div>
            </div>
            <div class="date-results" id="dateResults"></div>
          </section>
        </section>
      </section>

      <section class="special-summary" id="specialSummary" aria-label="Special dates"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
