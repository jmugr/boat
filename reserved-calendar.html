<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Way Reserved Calendar</title>
    <link rel="stylesheet" href="styles.css">
    <script>
      window.umamiBeforeSendHandler = function(type, payload) {
        try {
          if (localStorage.getItem("is_my_device") === "true") {
            return false;
          }
        } catch (_) {
          // Ignore storage access errors and continue tracking.
        }

        return payload;
      };
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="29ac1f53-e8da-4030-aa93-c7ea40858ef0" data-before-send="umamiBeforeSendHandler"></script>
  </head>
  <body>
    <main class="shell">
      <section class="mast mast--compact">
        <img src="assets/jeanneau-sun-odyssey-45ds-hero.png" alt="" class="mast__image">
        <div class="mast__content">
          <p class="eyebrow">My Way</p>
          <h1>Reserved Calendar</h1>
          <a class="page-link" href="index.html">Summer planner</a>
        </div>
      </section>

      <section class="workspace">
        <section class="results reserved-page" aria-live="polite">
          <section class="calendar-section" aria-labelledby="reservedCalendarTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Calendar</p>
                <h2 id="reservedCalendarTitle">Boat reserved dates</h2>
              </div>
              <div class="legend" aria-label="Calendar legend">
                <span><i class="good"></i>open</span>
                <span><i class="reserved"></i>boat reserved</span>
              </div>
            </div>
            <div class="calendar" id="reservedOnlyCalendar"></div>
          </section>

          <section class="reserved-detail-section" aria-labelledby="reservedListTitle">
            <div class="section-head">
              <div>
                <p class="eyebrow">Reserved</p>
                <h2 id="reservedListTitle">Reserved day details</h2>
              </div>
            </div>
            <div class="reserved-detail-list" id="reservedOnlyList"></div>
          </section>
        </section>
      </section>

      <section class="source">
        <div class="section-head">
          <div>
            <p class="eyebrow">Organized Source</p>
            <h2>Out-of-town dates</h2>
          </div>
        </div>
        <div class="source-grid" id="sourceGrid"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
